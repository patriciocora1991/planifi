<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futsal Load Pro - Gestión Avanzada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-filter { background-color: #1e293b; color: white; border-color: #1e293b; }
        .task-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-bolt text-yellow-400"></i> Futsal Performance
            </h1>
            <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Elite Training System</p>
        </div>
        <button onclick="toggleNewTaskModal()" class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-transform">
            <i class="fas fa-plus"></i>
        </button>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        
        <!-- VISTA DASHBOARD -->
        <div id="view-dashboard" class="tab-content active space-y-6">
            <section>
                <div class="flex justify-between items-end mb-3">
                    <h2 class="text-lg font-bold text-slate-700">Microciclo Actual</h2>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Estado de Carga</span>
                </div>
                <div class="grid grid-cols-5 gap-2" id="weekly-plan"></div>
            </section>

            <section>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold text-slate-700">Últimas Sesiones</h2>
                    <button onclick="switchTab('planner')" class="text-blue-600 text-xs font-bold uppercase tracking-tight">Planificar</button>
                </div>
                <div id="sessions-list" class="space-y-3"></div>
            </section>
        </div>

        <!-- VISTA PLANIFICADOR -->
        <div id="view-planner" class="tab-content space-y-6">
            <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <button onclick="switchTab('dashboard')" class="text-sm font-bold text-slate-500 hover:text-slate-700">← Volver</button>
                <h2 class="font-bold text-slate-800">Diseño de Sesión</h2>
                <button onclick="saveSession()" id="btn-save" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-700">Guardar</button>
            </header>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Fecha de Sesión</label>
                        <input type="date" id="input-date" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Objetivo Principal</label>
                        <input type="text" id="input-objective" placeholder="Ej: HIIT Corto + Transiciones" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                    </div>
                </div>
            </div>

            <!-- Indicador de Carga Proyectada -->
            <div id="load-indicator" class="p-5 rounded-2xl border-2 border-slate-200 bg-white shadow-sm flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div id="indicator-bar" class="w-4 h-12 rounded-full bg-slate-200"></div>
                    <div>
                        <p class="text-[10px] font-black uppercase opacity-60 tracking-widest">Intensidad Proyectada</p>
                        <p id="indicator-label" class="text-xl font-black text-slate-400 uppercase">Esperando Tareas</p>
                    </div>
                </div>
                <div class="text-right">
                    <div class="flex items-center gap-2 justify-end text-slate-700 font-bold">
                       <i class="fas fa-clock text-blue-500"></i> <span id="summary-time">0 min</span>
                    </div>
                    <p class="text-xs font-bold text-slate-500 italic">RPE Ponderado: <span id="summary-rpe">0</span></p>
                </div>
            </div>

            <!-- Estructura de Trabajo -->
            <div class="space-y-3">
                <h3 class="font-bold text-slate-700 px-1 flex items-center gap-2">
                    <i class="fas fa-layer-group text-blue-500"></i> Bloques de Trabajo
                </h3>
                <div id="current-tasks" class="space-y-2"></div>
            </div>

            <!-- Biblioteca de Tareas Expandida -->
            <div class="mt-8 space-y-4">
                <div class="flex flex-col gap-3">
                    <h3 class="font-bold text-slate-700">Biblioteca Metodológica</h3>
                    <div class="flex gap-1 overflow-x-auto no-scrollbar pb-2" id="filter-bar">
                        <button onclick="filterLibrary('todos')" class="filter-btn active-filter px-3 py-1.5 rounded-xl text-[10px] font-bold border border-slate-200 transition-all uppercase whitespace-nowrap" data-filter="todos">Todos</button>
                        <button onclick="filterLibrary('HIIT')" class="filter-btn px-3 py-1.5 rounded-xl text-[10px] font-bold border border-slate-200 transition-all uppercase whitespace-nowrap" data-filter="HIIT">HIIT/RSA</button>
                        <button onclick="filterLibrary('Reducidos')" class="filter-btn px-3 py-1.5 rounded-xl text-[10px] font-bold border border-slate-200 transition-all uppercase whitespace-nowrap" data-filter="Reducidos">Reducidos</button>
                        <button onclick="filterLibrary('Técnico')" class="filter-btn px-3 py-1.5 rounded-xl text-[10px] font-bold border border-slate-200 transition-all uppercase whitespace-nowrap" data-filter="Técnico">Técnico</button>
                        <button onclick="filterLibrary('Velocidad')" class="filter-btn px-3 py-1.5 rounded-xl text-[10px] font-bold border border-slate-200 transition-all uppercase whitespace-nowrap" data-filter="Velocidad">Velocidad/Tempo</button>
                    </div>
                </div>
                <div id="library-container" class="grid grid-cols-1 md:grid-cols-2 gap-2"></div>
            </div>
        </div>

        <!-- VISTA HISTORIAL -->
        <div id="view-history" class="tab-content space-y-6">
            <h2 class="text-lg font-bold text-slate-700">Historial de Cargas</h2>
            <div id="history-content" class="space-y-4"></div>
        </div>

    </main>

    <!-- Modal Nueva Actividad -->
    <div id="task-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl overflow-hidden shadow-2xl">
            <div class="bg-slate-900 p-6 text-white flex justify-between items-center">
                <h3 class="font-bold">Crear Nueva Tarea</h3>
                <button onclick="toggleNewTaskModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Nombre de la Actividad</label>
                    <input type="text" id="new-task-name" class="w-full mt-1 p-3 bg-slate-50 border rounded-xl" placeholder="Ej: HIIT 15x15">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Tipo</label>
                        <select id="new-task-cat" class="w-full mt-1 p-3 bg-slate-50 border rounded-xl">
                            <option value="HIIT">HIIT/RSA</option>
                            <option value="Reducidos">Reducidos</option>
                            <option value="Velocidad">Velocidad/Tempo</option>
                            <option value="Técnico">Técnico</option>
                            <option value="Táctico">Táctico</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">RPE (1-10)</label>
                        <input type="number" id="new-task-rpe" min="1" max="10" value="7" class="w-full mt-1 p-3 bg-slate-50 border rounded-xl">
                    </div>
                </div>
                <button onclick="createNewTask()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold hover:bg-blue-700">Añadir a Biblioteca</button>
            </div>
        </div>
    </div>

    <!-- Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 h-20 flex items-center justify-around px-4 z-50">
        <button onclick="switchTab('dashboard')" class="flex flex-col items-center gap-1 text-blue-600 nav-btn" data-tab="dashboard">
            <i class="fas fa-chart-bar text-xl"></i>
            <span class="text-[10px] font-black uppercase">Home</span>
        </button>
        <button onclick="switchTab('planner')" class="flex flex-col items-center gap-1 text-slate-400 nav-btn" data-tab="planner">
            <i class="fas fa-calendar-plus text-xl"></i>
            <span class="text-[10px] font-black uppercase">Sesión</span>
        </button>
        <button onclick="switchTab('history')" class="flex flex-col items-center gap-1 text-slate-400 nav-btn" data-tab="history">
            <i class="fas fa-file-invoice text-xl"></i>
            <span class="text-[10px] font-black uppercase">Archivo</span>
        </button>
    </nav>

    <script>
        // --- BASE DE DATOS METODOLÓGICA ---
        let TAREAS_BASE = [
            // HIIT & RSA
            { id: 101, cat: 'HIIT', nombre: 'HIIT Corto (10"x10")', color: 'ROJO', rpe: 9 },
            { id: 102, cat: 'HIIT', nombre: 'HIIT Medio (30"x30")', color: 'NARANJA', rpe: 8 },
            { id: 103, cat: 'HIIT', nombre: 'RSA (Sprints Repetidos)', color: 'ROJO', rpe: 10 },
            { id: 104, cat: 'HIIT', nombre: 'HIIT Largo (2\'x2\')', color: 'NARANJA', rpe: 7 },
            
            // REDUCIDOS
            { id: 201, cat: 'Reducidos', nombre: 'Reducido 3v3 SIN apoyos', color: 'ROJO', rpe: 9 },
            { id: 202, cat: 'Reducidos', nombre: 'Reducido 3v3 CON apoyos', color: 'NARANJA', rpe: 7 },
            { id: 203, cat: 'Reducidos', nombre: 'Reducido 4v4 SIN apoyos', color: 'NARANJA', rpe: 8 },
            { id: 204, cat: 'Reducidos', nombre: 'Reducido 2v2 Intenso', color: 'ROJO', rpe: 10 },
            
            // VELOCIDAD & TEMPO
            { id: 301, cat: 'Velocidad', nombre: 'Velocidad Lineal (Sprints)', color: 'ROJO', rpe: 9 },
            { id: 302, cat: 'Velocidad', nombre: 'Tempo Runs (Lineal)', color: 'AMARILLO', rpe: 5 },
            { id: 303, cat: 'Velocidad', nombre: 'Agilidad Reactiva', color: 'NARANJA', rpe: 7 },
            
            // TÉCNICO / TÁCTICO
            { id: 401, cat: 'Técnico', nombre: 'Rondo 4v1', color: 'VERDE', rpe: 3 },
            { id: 402, cat: 'Técnico', nombre: 'Circuito Técnico', color: 'AMARILLO', rpe: 4 }
        ];

        const SEMAFOROS = {
            VERDE: { bg: 'bg-green-500', text: 'text-green-600', border: 'border-green-200', label: 'Baja' },
            AMARILLO: { bg: 'bg-yellow-400', text: 'text-yellow-600', border: 'border-yellow-200', label: 'Media' },
            NARANJA: { bg: 'bg-orange-500', text: 'text-orange-600', border: 'border-orange-200', label: 'Alta' },
            ROJO: { bg: 'bg-red-600', text: 'text-red-600', border: 'border-red-200', label: 'Extrema' }
        };

        // --- ESTADO ---
        let currentSessionTasks = [];
        let savedSessions = JSON.parse(localStorage.getItem('futsal_v3_sessions')) || [];
        let customTasks = JSON.parse(localStorage.getItem('futsal_v3_custom')) || [];
        let currentFilter = 'todos';

        // --- CORE LOGIC ---
        function init() {
            renderWeeklyPlan();
            renderSessionsList();
            renderLibrary();
            document.getElementById('input-date').valueAsDate = new Date();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`view-${tabId}`).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const isActive = btn.dataset.tab === tabId;
                btn.classList.toggle('text-blue-600', isActive);
                btn.classList.toggle('text-slate-400', !isActive);
            });

            if(tabId === 'history') renderHistoryFull();
            if(tabId === 'dashboard') renderSessionsList();
        }

        function toggleNewTaskModal() {
            const modal = document.getElementById('task-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        function createNewTask() {
            const name = document.getElementById('new-task-name').value;
            const cat = document.getElementById('new-task-cat').value;
            const rpe = parseInt(document.getElementById('new-task-rpe').value);
            
            if(!name) return;

            let color = 'VERDE';
            if(rpe >= 9) color = 'ROJO';
            else if(rpe >= 7) color = 'NARANJA';
            else if(rpe >= 5) color = 'AMARILLO';

            const newTask = { id: Date.now(), cat, nombre: name, color, rpe };
            customTasks.push(newTask);
            localStorage.setItem('futsal_v3_custom', JSON.stringify(customTasks));
            
            renderLibrary();
            toggleNewTaskModal();
            document.getElementById('new-task-name').value = '';
        }

        function filterLibrary(cat) {
            currentFilter = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active-filter', btn.dataset.filter === cat);
            });
            renderLibrary();
        }

        function renderLibrary() {
            const container = document.getElementById('library-container');
            const allTasks = [...TAREAS_BASE, ...customTasks];
            
            const filtered = currentFilter === 'todos' 
                ? allTasks 
                : allTasks.filter(t => t.cat === currentFilter);

            container.innerHTML = filtered.map(t => `
                <button onclick="addTaskToSession(${t.id})" class="task-card bg-white p-4 rounded-2xl border border-slate-200 text-left hover:border-blue-400 shadow-sm transition-all flex justify-between items-center">
                    <div>
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">${t.cat}</p>
                        <p class="text-sm font-bold text-slate-700 leading-tight">${t.nombre}</p>
                        <p class="text-[10px] text-slate-400 mt-1">RPE Sugerido: ${t.rpe}</p>
                    </div>
                    <div class="w-3 h-3 rounded-full ${SEMAFOROS[t.color].bg} shadow-inner"></div>
                </button>
            `).join('');
        }

        function addTaskToSession(id) {
            const allTasks = [...TAREAS_BASE, ...customTasks];
            const base = allTasks.find(t => t.id === id);
            const taskInstance = { 
                ...base, 
                instanceId: Date.now() + Math.random(),
                duracion: 15 
            };
            currentSessionTasks.push(taskInstance);
            updatePlannerUI();
        }

        function updateTaskTime(instanceId, newTime) {
            const task = currentSessionTasks.find(t => t.instanceId == instanceId);
            if(task) {
                task.duracion = parseInt(newTime) || 0;
                calculateOverallLoad();
            }
        }

        function removeTask(instanceId) {
            currentSessionTasks = currentSessionTasks.filter(t => t.instanceId !== instanceId);
            updatePlannerUI();
        }

        function updatePlannerUI() {
            const container = document.getElementById('current-tasks');
            if(currentSessionTasks.length === 0) {
                container.innerHTML = `<div class="text-center py-10 bg-slate-100 rounded-2xl border-2 border-dashed border-slate-200 text-slate-400 italic text-sm">Agregá bloques de la biblioteca para calcular carga</div>`;
            } else {
                container.innerHTML = currentSessionTasks.map((t, idx) => `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center animate-in slide-in-from-right-5 duration-200">
                        <div class="flex items-center gap-3">
                            <div class="bg-slate-800 text-white w-6 h-6 rounded flex items-center justify-center font-bold text-[10px]">${idx + 1}</div>
                            <div>
                                <p class="font-bold text-slate-800 text-sm">${t.nombre}</p>
                                <p class="text-[9px] font-bold uppercase text-slate-400 tracking-wide">${t.cat} | RPE ${t.rpe}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="flex items-center bg-slate-50 rounded-lg px-2 border">
                                <input type="number" value="${t.duracion}" 
                                    onchange="updateTaskTime(${t.instanceId}, this.value)"
                                    class="w-10 bg-transparent text-center font-bold text-sm p-1 outline-none">
                                <span class="text-[10px] font-bold text-slate-400">min</span>
                            </div>
                            <button onclick="removeTask(${t.instanceId})" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash-alt text-sm"></i></button>
                        </div>
                    </div>
                `).join('');
            }
            calculateOverallLoad();
        }

        function calculateOverallLoad() {
            if(currentSessionTasks.length === 0) {
                updateIndicator('VERDE', 0, 0);
                return;
            }

            let weightedRpeSum = 0;
            let totalTime = 0;
            let highestRpe = 0;

            currentSessionTasks.forEach(t => {
                weightedRpeSum += (t.rpe * t.duracion);
                totalTime += t.duracion;
                if(t.rpe > highestRpe) highestRpe = t.rpe;
            });

            const rpePonderado = totalTime > 0 ? (weightedRpeSum / totalTime).toFixed(1) : 0;
            
            let color = 'VERDE';
            if(rpePonderado >= 8 || highestRpe >= 9) color = 'ROJO';
            else if(rpePonderado >= 6) color = 'NARANJA';
            else if(rpePonderado >= 4) color = 'AMARILLO';

            updateIndicator(color, rpePonderado, totalTime);
        }

        function updateIndicator(color, rpe, time) {
            const style = SEMAFOROS[color];
            const banner = document.getElementById('load-indicator');
            banner.className = `p-5 rounded-2xl border-2 ${style.border} ${style.bg} bg-opacity-10 shadow-sm flex justify-between items-center transition-all duration-300`;
            
            document.getElementById('indicator-bar').className = `w-4 h-12 rounded-full ${style.bg} shadow-sm`;
            document.getElementById('indicator-label').className = `text-xl font-black ${style.text} uppercase`;
            document.getElementById('indicator-label').innerText = `${color} — ${style.label}`;
            
            document.getElementById('summary-time').innerText = `${time} min`;
            document.getElementById('summary-rpe').innerText = rpe;
        }

        function saveSession() {
            if(currentSessionTasks.length === 0) return;
            const color = document.getElementById('indicator-label').innerText.split(' — ')[0];
            
            const session = {
                id: Date.now(),
                fecha: document.getElementById('input-date').value,
                objetivo: document.getElementById('input-objective').value || 'Sesión sin título',
                totalTime: document.getElementById('summary-time').innerText,
                rpe: document.getElementById('summary-rpe').innerText,
                color: color,
                tareas: [...currentSessionTasks]
            };

            savedSessions.unshift(session);
            localStorage.setItem('futsal_v3_sessions', JSON.stringify(savedSessions));
            
            currentSessionTasks = [];
            document.getElementById('input-objective').value = '';
            updatePlannerUI();
            switchTab('dashboard');
        }

        function renderSessionsList() {
            const container = document.getElementById('sessions-list');
            if(savedSessions.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 border border-dashed border-slate-200">Sin sesiones registradas esta semana</div>`;
                return;
            }
            container.innerHTML = savedSessions.slice(0, 3).map(s => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl ${SEMAFOROS[s.color].bg} flex items-center justify-center text-white font-black text-xs shadow-sm">${s.rpe}</div>
                        <div>
                            <p class="font-bold text-slate-800 text-sm leading-tight">${s.objetivo}</p>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">${s.fecha} • ${s.totalTime}</p>
                        </div>
                    </div>
                    <i class="fas fa-check-circle text-green-500/30"></i>
                </div>
            `).join('');
        }

        function renderHistoryFull() {
            const container = document.getElementById('history-content');
            if(savedSessions.length === 0) {
                container.innerHTML = `<div class="text-center py-20 opacity-20"><i class="fas fa-folder-open text-6xl"></i></div>`;
                return;
            }
            container.innerHTML = savedSessions.map(s => `
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[10px] font-black text-slate-300 uppercase tracking-widest">${s.fecha}</p>
                            <h4 class="font-black text-slate-800 text-lg leading-tight">${s.objetivo}</h4>
                        </div>
                        <span class="px-2 py-1 rounded-lg text-[9px] font-black text-white ${SEMAFOROS[s.color].bg}">${s.color}</span>
                    </div>
                    <div class="flex gap-4 text-[11px] font-bold text-slate-500 border-b border-slate-50 pb-2">
                        <span><i class="fas fa-clock mr-1 text-blue-500"></i> ${s.totalTime}</span>
                        <span><i class="fas fa-heartbeat mr-1 text-red-500"></i> RPE ${s.rpe}</span>
                    </div>
                    <div class="flex flex-wrap gap-1 mt-2">
                        ${s.tareas.map(t => `<span class="text-[9px] bg-slate-100 px-2 py-0.5 rounded-full text-slate-600 font-bold border border-slate-200">${t.nombre}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderWeeklyPlan() {
            const container = document.getElementById('weekly-plan');
            const plan = [
                { d: 'MAR', c: 'bg-red-600', l: 'Alta' },
                { d: 'MIE', c: 'bg-orange-500', l: 'Tact' },
                { d: 'JUE', c: 'bg-yellow-500', l: 'Ajuste' },
                { d: 'VIE', c: 'bg-green-500', l: 'Baja' },
                { d: 'SAB', c: 'bg-blue-600', l: 'GAME' }
            ];
            container.innerHTML = plan.map(p => `
                <div class="bg-white rounded-xl overflow-hidden border border-slate-100 shadow-sm flex flex-col items-center">
                    <div class="w-full ${p.c} py-1 text-center"><span class="text-[9px] font-black text-white uppercase">${p.d}</span></div>
                    <div class="py-3 text-center">
                        <p class="text-[8px] font-black text-slate-400 uppercase leading-none mb-1">${p.l}</p>
                        <div class="w-1.5 h-1.5 rounded-full bg-slate-200 mx-auto"></div>
                    </div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
